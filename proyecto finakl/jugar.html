<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.67, maximum-scale=0.67, user-scalable=no">
    <title>Juego de Cartas</title>
    <link rel="stylesheet" href="jugar.css">
</head>
<body>
  <div id="left-column">
  <div class="game">
    <div class="player opponent">
      <div class="interaction">
      <h2>Oponente</h2>
      <div class="life">Vida: <span id="enemyLife">20</span></div>
      <div class="mana">Maná: <span id="enemyMana">W:0 U:0 B:0 R:0 G:0 C:0</span></div>
    </div>
    <div id="EnemyBattlefield"><div class="cardcreature"></div><div class="cardlands"></div></div>
    </div>
    
    <div class="buttons">
      <button id="attackBtn">Atacar</button>
      <button id="robarBtn" onclick="robarCarta()">Robar</button>
      <button id="embarajar" onclick="embarajar(deckPlayer)">Embarajar</button>
      <button id="NoBloqueo">No bloquear</button>
      <button id="confirmBlock">Confirmar bloqueo</button>
      <button id="pasar" onclick="updateTurn()">Pasar</button>
    </div>
    <div class="playeryou">
      <div class="interaction">
      <h2>Tú</h2>
      <div class="life">Vida: <span id="playerLife">20</span></div>
      <div class="mana">Maná: <span id="playerMana">W:0 U:0 B:0 R:0 G:0 C:0</span></div>
      </div>
      <div id="PlayerBattlefield"><div class="cardcreature"></div><div class="cardlands"></div></div>
    </div>

    <div id="mano"></div>

  </div>
</div>

  
  <div id="right-column">
    <div id="log">
      <div class="log-line">La partida comienza.</div>
    </div>

    <div id="tutorial" class="tutorial-box">
      <div class="tutorial-character">
        <img id="tutorialPortrait" src="img/narrador.png" alt="Narrador" />
      </div>
      <div class="tutorial-content">
        <div class="tutorial-header">Narrador del Multiverso</div>
        <div id="tutorialText" class="tutorial-text">Bienvenido a la arena. Yo seré tu guía en esta partida de fantasía medieval.</div>
        <div class="tutorial-actions">
          <button id="tutorialSkip">Omitir</button>
          <button id="tutorialNext">Continuar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tutorialMini" class="tutorial-mini">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%23d8c486'/%3E%3Cstop offset='100%25' stop-color='%236d4b2a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='24' fill='%231c150f'/%3E%3Ccircle cx='60' cy='50' r='24' fill='url(%23g)' opacity='.9'/%3E%3Cpath d='M36 84c8-10 18-14 30-14s22 4 30 14' fill='none' stroke='%23f5e0aa' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E" alt="Narrador mini" />
    <span>Mostrar guía</span>
  </div>

 

<div id="preview"></div>
  <script src="jugar.js"></script>
</body>
</html>
